[meta]
description = "Setting-1 for social-interaction simulations."

########################################################
# module type names included in the simulation
########################################################

[modules]
Kinetics = [
    "Dynamics_Overdamped",
    "Dynamics_Inertial",
]
Social = [
    "Soc_KR2021",
    "Soc_G2012",
    "Soc_KV",
    "Soc_TK2020",
    "Soc_Null",
]

########################################################
# parameters for each kinetics module
########################################################

[parameters.Kinetics.Dynamics_Overdamped]
sigma_theta = 0.5

[parameters.Kinetics.Dynamics_Inertial]
sigma_omega = 0.5
tau = 0.1


########################################################
# parameters for each social interaction module
########################################################

[parameters.Social.Soc_KR2021]
k_alg = 0.4
k_pos = 0.8
m = 0.6
d_eq = 0.02

[parameters.Social.Soc_G2012]
k_pos = 1.0
k_alg = 1.0

[parameters.Social.Soc_KV]
k_alg = 2.0

[parameters.Social.Soc_TK2020]
k_sep = 0.4
k_coh = 0.5
k_alg = 0.2

[parameters.Social.Soc_Null]
